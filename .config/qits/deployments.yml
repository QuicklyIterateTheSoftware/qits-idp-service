# How qits-deployments deploys this repo. It reads this file from the git host at
# the built sha, so the answer travels with the commit.
#
# CARRYING THE FILE AT ALL is the other thing it says. The release flow reads it to decide whether
# this repository deploys — a library or an SPA carries none, and its `main` is finalized at the
# release itself rather than after a deployment — and where it does deploy, a Deployment Request
# carries the released VERSION. `deploy_branches` used to name a branch here, in thirteen copies of
# one platform-wide answer, and a release pushed onto every entry it named.
#
# THE NAME THIS DEPLOYS AS, spelled because the repository is renamed and the application is not.
# Every derivation the deployer makes hangs off this name — the wire alias peers dial, the container
# it manages, the extras family, the database — so letting it follow the repository would
# decommission the running service and start a stranger beside it.
application: qits-idp

# This is a redirect destination and token/JWKS surface, not a left-navigation destination.
routes: /idp

# THE LOGIN HOST. The edge sends a browser with no session to the host of whichever deployment
# owns the login route, so `idp.<domain>` is where /idp/login lives and where WebAuthn runs.
# Nothing is served on the environment door itself any more. No navigation-entries: the login
# page is not a place to go to from the sidebar.
host: idp

# The convention would derive the health path from the repository name, but the route path
# deliberately did not move with the rename — the service still serves /idp. Without this line
# the deployer probes a 404 and rolls every deployment back as unhealthy.
health_path: /idp/q/health/ready

# THE STORE. A role and a database of this service's own on the platform's postgres, created before
# the successor container starts and injected as QITS_RESOURCE_DB_URL / _USERNAME / _PASSWORD — the
# generic contract the idp jar's datasource defaults read verbatim. The name is omitted, so the
# database and the role are both `qits_idp`, derived from the application name.
#
# A CORE SEED SERVICE, WHICH IS WHY THE LINE ALONE IS NOT THE WHOLE ANSWER. This container boots
# from the bootstrap CLI before any deployer exists, so at bootstrap the CLI provisions the same
# database over plain JDBC and hands over the same three variables. This file is what governs every
# deployment after that one.
#
# THE SIGNING KEY LIVES IN THAT DATABASE. A redeploy that reached a different or an empty one would
# generate a new keypair and invalidate every token in flight, everywhere — so the database must be
# the same one across deployments, which is exactly what a provisioned resource is and what an
# ephemeral container layer is not.
#
# THE NAME FOLLOWS THE APPLICATION (epic qits-2174, task qits-2194). Until 2026-11-14 the store was
# pinned to the predecessor's `qits_platform_idp`, because a changed name
# used to provision an empty database on a green deploy — and for this service that was more than a
# cold cache: an idp that came up against an empty database would mint a new signing keypair and
# invalidate every token in flight, with nothing in any log to say why. Since qits-2175 a change of
# the effective name is a MOVE: qits-deployments stops the service, copies the WHOLE database —
# signing keypair included — into the new name, compares every table's rows, and only then starts
# idp against it; the source is kept for its retention period as the way back. That row comparison
# is what makes the rename safe without a pin: it is exactly what rules out the empty-database case
# that used to be the danger. Dropping the pin moved the store to `qits_idp` that way; the
# eventstream database was already `qits_idp_eventstream` and does not move.
#
# idp:client — THIS APPLICATION'S OWN SERVICE CLIENT, COMMISSIONED LIKE EVERY OTHER SERVICE'S
# (epic qits-428). qits-deployments creates `<env>-qits-idp` through this service's own commission
# API — on the instance already running, as every redeploy does — stores the secret like the
# database password, and injects QITS_RESOURCE_IDP_CLIENT_ID / _CLIENT_SECRET (and an edge
# QITS_RESOURCE_IDP_URL, which this service deliberately does not read). The `qits` oidc client in
# application.properties mints its bearer from that pair AT ITSELF, http://localhost:8080/idp, and
# qits-telemetry-core attaches it to every OTLP export, because the edge in front of
# qits-observability refuses an anonymous POST. The claim also keeps the client out of
# UnclaimedServiceClientCollector's reach, which deletes any service client no deployment claims.
#
# postgresql:eventstream:qits_idp_eventstream — THE EVENT BUS'S OUTBOX (qits-1977). Users.delete
# announces UserDeleted through qits-eventstream, and that library is a Flyway lineage and a
# datasource of its own: it reads the `eventstream` name in its shipped defaults, so the deployer
# injects QITS_RESOURCE_EVENTSTREAM_URL / _USERNAME / _PASSWORD for it and the spelling is not a
# choice made here. It cannot share qits_idp — two lineages, and the signing key's store is
# nobody else's. The database is NAMED because the default derivation would collide with the
# store above, not because of any rename. It is a NEW database, so the first deploy of this version
# provisions an empty one, which is exactly what an outbox starts as. The bearer the library presents
# to qits-events is the idp:client pair below, minted at itself.
resources: postgresql:db, postgresql:eventstream:qits_idp_eventstream, idp:client

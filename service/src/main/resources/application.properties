# The application config for qits-idp as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to a library jar's META-INF/microprofile-config.properties at ordinal 100, which is how
# a context ships DEFAULTS it does not own the deployment of. The `idp` module's own defaults (its
# datasource, Flyway lineage, token lifetime, public clients) stay there; a deployment still
# overrides any of them by env.

quarkus.application.name=qits-idp

# The prefix every route of this service lives under. qits-platform-edge routes by the deployment's
# declared routes and passes the path untouched — /idp/* reaches qits-platform-idp verbatim — so the
# service itself has to serve /idp/..., and there is no unprefixed form. This holds for
# service-to-service calls on qits-net too; they skip the edge but address the same paths.
#
# NOTE THE DIFFERENCE from the siblings, which set this to /<segment>/api. The idp's surface is
# OIDC's, and OIDC fixes the shape: a consumer configured with auth-server-url
# http://qits-platform-idp:8080/idp fetches /idp/.well-known/openid-configuration and follows the
# document from there. An /api segment would move the discovery document off the path every OIDC
# client derives. Everything that is not the protocol goes under /idp/api — the commission API at
# /api/clients, the user surface at /api/auth, introspection at /api/sessions, minting at
# /api/register-tokens — which keeps the admin and browser surfaces separate from the protocol
# surface without moving the protocol, and keeps the Quinoa ignore list below to one entry for all
# of them.
quarkus.rest.path=/idp

# Quarkus' non-application root — what the framework serves rather than application code. It sits
# OUTSIDE quarkus.rest.path, so it has to carry the segment on its own or it stays at / and is
# unreachable through the gateway. /idp/q/health/ready is what the deployer's health gate curls.
quarkus.http.non-application-root-path=/idp/q

# --- the API document ---------------------------------------------------------------------------
# Served at /idp/q/openapi, under the non-application root above, which the Quinoa ignore list
# already covers. Every route sets its operationId: the name consumer pacts and the golden masters
# (golden-masters/index.json) use for it.
quarkus.smallrye-openapi.info-title=qits-idp API

# --- the client ---------------------------------------------------------------------------------
# Quinoa builds src/main/webui (the qits-platform-spa-idp submodule, an Angular SPA) during
# augmentation and serves the output as static resources. The platform's schema, unchanged here: the
# client at /<segment>/, the machine-admin API at /<segment>/api.
#
# ui-root-path is the segment itself. It is spelled here AND as Angular's baseHref in the submodule's
# angular.json ("/idp/") — Quinoa mounts the files, the baseHref is what makes index.html ask for
# them at the right url, and a mismatch serves a page whose every asset 404s with nothing on this
# side to notice.
quarkus.quinoa.ui-root-path=/idp

# Deep links. The client's four doors — /idp/login, /idp/register, /idp/clients and /idp/users —
# have no file behind them, so without this a reload or a pasted link 404s and only the entry page
# works. The Angular router owns them; this is what lets it. They are what the fallback exists to
# serve, and the list below is what keeps it from serving anything else.
quarkus.quinoa.enable-spa-routing=true

# Angular's output. Quinoa can derive this from the client's angular.json, but it derives it from a
# project NAME — pinning it means a rename over there fails this build ("Quinoa build directory not
# found") rather than resolving somewhere stale.
quarkus.quinoa.build-dir=dist/qits-platform-spa-idp/browser

# WHAT THE SPA FALLBACK MUST NOT SWALLOW, and this service has more of it than any sibling.
#
# THE REASON IS quarkus.rest.path=/idp, thirty lines up. Everywhere else the REST surface is
# /<segment>/api, one segment below the client, so a service's machine routes are a single prefix.
# Here the REST surface IS the segment: OIDC fixes the discovery path, so /idp/.well-known/…,
# /idp/token and /idp/jwks sit directly BESIDE the SPA's own routes rather than under an /api of
# their own. The client and the protocol share one root, and this key is the whole of what tells
# them apart.
#
# The fallback is a late-order catch-all: anything with a real route in front of it still wins, but
# a request matching NO route is rerouted to index.html and answers 200 text/html. THAT IS THE
# STAKE HERE. A mistyped protocol path answering a page is not one bad response — an OIDC consumer
# that asked for a discovery document and got HTML would CACHE it, and every service on the platform
# is such a consumer. The correct answer to a mistyped machine path is a 404.
#
# Values are matched AFTER ui-root-path is stripped, so they are RELATIVE — /token, never
# /idp/token. An absolute value matches nothing and is indistinguishable from an unset key: the
# failure that hides. The list is therefore the derived pair plus the three protocol literals:
#
#   /api          EVERY non-protocol route this service has — the commission API
#                 (/idp/api/clients), the user surface (/idp/api/auth/*), session introspection
#                 (/idp/api/sessions/introspect) and register-token minting
#                 (/idp/api/register-tokens). One entry covers all of them because they all sit
#                 under /api, which is the reason to keep putting new routes there.
#   /q            health (quarkus.http.non-application-root-path), so /idp/q
#   /.well-known  the discovery document
#   /token        the client_credentials endpoint
#   /jwks         the published signing keys
#
# Setting this key REPLACES Quinoa's derivation rather than extending it, which is why /api and /q
# are repeated by hand. Leaving it unset is not an option here even in principle: the derivation is
# built from quarkus.rest.path and quarkus.http.non-application-root-path, and quarkus.rest.path is
# the ui-root itself, so there is no relative prefix for it to derive.
#
# /idp/api AND /idp/clients BOTH EXIST AND DO NOT COLLIDE. The first is the commission API and is
# ignored here; the second is a page the SPA draws and must fall back. They read alike and are
# different first segments — a reason to keep the API's routes under /api rather than growing a
# second literal beside the client's routes.
#
# MEASURED on this service's packaged fast-jar, 2026-08-14, and both results are worth knowing:
#
#   /idp/api/nope, /idp/.well-known/nope and /idp/q/nope each answer 404 from Quarkus' own
#   not-found handler — a 53-byte <html><body><h1>Resource not found</h1></body></html>. Note that
#   it IS text/html: an ignored prefix is not rerouted to index.html, but what answers instead is
#   still a browser's content type. The refusal is the status, and there is no document in it to
#   cache. "Never HTML" is the wrong test; "never the client's page" is the right one, and
#   IdpPackagedSurfaceIT asserts it by looking for the base href.
#
#   AN ENTRY PROTECTS A SEGMENT, NOT A STRING PREFIX. /idp/token-nope and /idp/jwks-nope are NOT
#   covered by /token and /jwks — they answer 200 index.html. That is accepted rather than fixed:
#   /idp is browser-facing and its unmatched paths belong to the Angular router by design, while a
#   machine derives its paths from the discovery document and cannot arrive at one of these. The
#   consequence for a new route is the rule, though — give it a segment of its own, or a
#   hand-typed sibling of it gets the page.
#
# Add a literal route under /idp and its entry here IN THE SAME COMMIT. That is the doctrine's rule
# (docs/project-setup-quinoa-angular.md in the qits superproject) and this is the service where
# forgetting it is most expensive.
quarkus.quinoa.ignored-path-prefixes=/api,/q,/.well-known,/token,/jwks,/authorize

# quarkus.quinoa.package-manager-install is deliberately NOT here. A local or CI mvnw build uses the
# node on PATH, so no build silently downloads a toolchain; the two install flags appear only in
# docker/Dockerfile's builder stage, which ships no node at all. A machine with no node fails at
# Quinoa's npm invocation, and the fix is node on PATH.
#
# Quinoa is also disabled by default in TEST mode and is left that way. A @QuarkusTest asserting
# anything about /idp/ would pass against a process with no client in it, so what the SPA is
# actually served as is proved against the packaged artifact and nowhere else — IdpPackagedSurfaceIT.

# --- the WebAuthn ceremony ------------------------------------------------------------------------
# quarkus-security-webauthn is used HERE AS A LIBRARY, NOT AS A LOGIN. IdpAuthController calls
# WebAuthnSecurity itself — get a challenge, verify an attestation, verify an assertion — and then
# issues the idp's own opaque `qits-session`. The extension's own `quarkus-credential` cookie is
# never written, because nothing here calls rememberUser().
#
# THE RELYING PARTY AND THE ORIGIN LIST ARE NOT WRITTEN HERE, AND A DEPLOYMENT CANNOT SET THEM.
# DerivedBrowserHosts — a config source factory, registered through META-INF/services — reads the
# platform's domain once, from QITS_DOMAIN, and composes both:
#
#   quarkus.webauthn.relying-party.id  the stated domain, FLAT. A passkey is bound to the rp id it
#                                      was registered under and will not assert under another, so
#                                      the flat apex is what lets one credential work on every host
#                                      of the installation. THERE IS DELIBERATELY NO OVERRIDE to pin
#                                      the old value across a domain change — an explicit owner
#                                      decision, recorded in PlatformDomain.relyingPartyId, where
#                                      the next person to reach for one will read it.
#   quarkus.webauthn.origins           the canonical origin below, the same value, so the two sides
#                                      of the ceremony cannot disagree. BrowserSso reads this key
#                                      back at startup and refuses to start if it does not name the
#                                      origin, because a mismatch fails every ceremony closed with
#                                      no configuration error anywhere.
#
# The list is the page origins the ceremony accepts, checked against the browser's own
# clientDataJSON. It is NOT derived from the request, because a request's Host header is the
# caller's to set.
#
# WITH NO DOMAIN STATED BOTH COME OUT AS THE DEVELOPER HOST: localhost and http://localhost:8080,
# the values this repository has always shipped, and not idp.qits.localhost:8080. `localhost` is a
# SECURE CONTEXT over plain http by browser rule — as are *.localhost and the loopback addresses —
# so passkeys work there with no TLS at all, nothing resolves the longer name on a developer's
# machine, and the emulated authenticator the suite runs the real ceremony against hard-hashes
# `localhost` as its relying party with no way to change it. The one route that is not a secure
# context is a raw IP (http://<wsl-ip>:8080, today's Windows-browser path here), where
# navigator.credentials does not exist and only the password fallback logs in; the client says so on
# the page rather than letting the ceremony fail cryptically.

# What the browser's own passkey prompt shows the user. Not an identifier — the rp id above is.
quarkus.webauthn.relying-party.name=${QITS_IDP_WEBAUTHN_RP_NAME:qits platform}

# --- browser SSO -------------------------------------------------------------------------------
# NOTHING ON THE BROWSER BOUNDARY IS CONFIGURED HERE ANY MORE, AND THAT IS THE POINT OF THIS BLOCK.
# The platform's domain is ONE fact — the bootstrap's own --domain input, propagated into every
# container as QITS_DOMAIN — and every browser-facing name this service composes comes out of it:
#
#   the canonical origin   https://idp.qits.<domain>, or http://localhost:8080 with none stated.
#                          `idp` is this repository's `host:` in .config/qits/deployments.yml and
#                          `qits` is the platform's own project slug, so the origin is the platform's
#                          hostname grammar applied to this application like to any other. The slug
#                          is a single named constant in PlatformDomain, not a literal per
#                          derivation.
#   the cookie parent      the stated domain, so the apex and every browser host under it share one
#                          login; host-only with none stated. The edge strips the cookie before
#                          machine vhosts.
#   the WebAuthn pair      see the block above.
#   the return-host list   below.
#
# WHY NONE OF IT IS A KEY. Three of them WERE keys, injected by the bootstrap and by
# qits-deployments, and all three still said https://idp.dev.qits.wohlben.eu after the `qits` project
# became env-less — an address that had stopped resolving. They named the same fact QITS_DOMAIN
# already carries, from outside the repository that has to keep them in step with each other, so
# nothing here could notice they had gone stale. A value nobody can set is a value nobody can leave
# behind. QITS_IDP_BROWSER_SSO_CANONICAL_ORIGIN, QITS_IDP_BROWSER_SSO_COOKIE_DOMAIN,
# QITS_IDP_WEBAUTHN_RP_ID and QITS_IDP_WEBAUTHN_ORIGINS are read by nothing now; a deployment that
# still sets them is simply ignored.
#
# WebAuthn happens only at the canonical origin. Environment hosts return a visitor here and the
# SPA asks /idp/api/auth/return-location for its server-validated destination after login or
# registration.
#
# THE RETURN-HOST ALLOW-LIST IS NOT CONFIGURED EITHER. It is derived from the domain — QITS_DOMAIN, the
# bootstrap's own --domain input and the platform-wide name for this one value — as exactly two
# entries: the exact authority <domain>, and the wildcard *.<domain>, which admits UP TO THREE
# extra labels in front. Three is the hostname grammar's own depth: a name is
# <app>[.<env>].<project>.<domain> read right to left, so the list covers qits.<domain>,
# projects.qits.<domain>, dev.qits.<domain> and projects.dev.qits.<domain> — every project and
# every environment, with this service knowing neither. A fourth label is not a name the grammar
# can produce and is refused.
#
# The port is part of an authority, so the canonical origin's port (where it has one) is appended
# to both derived entries: locally the domain is `localhost` and the list is localhost:8080 and
# *.localhost:8080, which allows ci.dev.qits.localhost:8080 and refuses ci.dev.qits.localhost:9090.
#
# The extra labels are safe because the wildcard is anchored under the platform's own domain by
# construction, and the zone's *, *.* and *.*.* records all resolve to the platform's edge, where
# an unclaimed name answers 404 — the widening reaches platform-served names only. The anchor is
# what carries that, not the label count, and a derived list cannot be anchored anywhere else.
#
# A return-location call with no host — a login typed or bookmarked rather than bounced by the
# edge — and one with a refused host both land at the platform's FRONT DOOR: the cookie parent
# domain, when the derived list names it (a public installation's cookie parent IS the stated
# domain, which is the exact entry, and the edge forwards the apex's / to the landing
# application). When it does not — locally the cookie is host-only and names no parent at all —
# the canonical origin remains the answer, as it was while the login still lived on the door
# itself.
#
# qits.idp.browser-sso.domain IS DELIBERATELY NOT A LINE HERE. DerivedBrowserHosts writes it, at an
# ordinal above this file, from QITS_DOMAIN — which keeps the one read of that variable in one place
# beside the derivations that need it, rather than restating the variable and its `localhost` default
# in a second dialect here.

# THE BUILT-IN ENDPOINTS STAY OFF, and these two lines are their shipped defaults restated on
# purpose. Turning either on would put a second door beside /idp/api/auth — one that registers
# without a register token and logs in by setting the extension's own cookie, which is not the
# credential the edge introspects. A Quarkus upgrade that changed either default would be a diff
# here rather than a silent second login route.
quarkus.webauthn.enable-registration-endpoint=false
quarkus.webauthn.enable-login-endpoint=false
#
# WHAT THE EXTENSION REGISTERS ANYWAY, since it cannot be turned off separately and is worth knowing:
# /idp/q/webauthn/{register,login}-options-challenge, /idp/q/webauthn/webauthn.js,
# /idp/q/webauthn/logout, and /.well-known/webauthn. The first two only mint a challenge into a
# cookie — they create no account and, because the extension's credential exclusion list is disabled
# upstream, they do not answer whether a username exists. All of them sit under /idp/q, which the
# ignore list above already covers; /.well-known/webauthn is registered at the ROOT rather than under
# /idp, so the gateway never routes to it at all.

# THE CHALLENGE COOKIE'S ENCRYPTION KEY IS GENERATED PER PROCESS, WHICH IS INTENDED — but the log
# line announcing it is not. quarkus.http.auth.session.encryption-key is unset here, so the recorder
# makes a random one at boot and WARNs with the key IN THE MESSAGE. This service's logs ship to
# qits-observability, and a key must not ride the log plane, so that one category is silenced to
# ERROR. The generated key is the right behaviour otherwise: one idp process is assumed, and a
# restart then invalidates only the ceremonies in flight during it — seconds, and the browser simply
# asks for a fresh challenge. A deployment that ever runs two idp processes sets
# QUARKUS_HTTP_AUTH_SESSION_ENCRYPTION_KEY on both, and this line stops mattering.
quarkus.log.category."io.quarkus.security.webauthn.WebAuthnRecorder".level=ERROR

# --- what a deployment MUST override ------------------------------------------------------------
# Deliberately NOT pinned here, because any value this repo picks would be wrong and wrong quietly:
#
#   QITS_RESOURCE_DB_URL              The store, as the platform's generic resource triple, with
#   QITS_RESOURCE_DB_USERNAME         _USERNAME and _PASSWORD. NOT SET BY HAND: the deployer
#   QITS_RESOURCE_DB_PASSWORD         provisions the database named by `resources: postgresql:db` in
#                                     .config/qits/deployments.yml and injects all three, and the
#                                     bootstrap CLI does the same for this service's seed container.
#                                     The process refuses to boot without them, on purpose. THE
#                                     SIGNING KEY LIVES THERE: an idp handed a different or empty
#                                     database rotates its key by accident and invalidates every
#                                     token in flight.
#
#   QITS_IDP_SEED_CLIENT_ID           The very first service client, on a fresh installation only.
#   QITS_IDP_SEED_CLIENT_SECRET       No service client ships with this jar; one with no row issues
#                                     nothing. Read once, behind the idp_seed marker row.
#
#   QITS_DOMAIN                       The platform's domain, and the WHOLE of the browser boundary:
#                                     the login origin, the session cookie's parent, the WebAuthn
#                                     relying party and origin list, and the return-host allow-list
#                                     are all composed from it and none of them is separately
#                                     settable (see "browser SSO" above). It is set by
#                                     qits-deployments on every container, so this is not a value
#                                     to write by hand either; with none stated everything comes out
#                                     as the developer host. The token issuer is derived from it
#                                     too: https://idp.qits.<domain> (qits-730).
#
# GONE, AND SET BY NOTHING: QITS_IDP_WEBAUTHN_RP_ID, QITS_IDP_WEBAUTHN_ORIGINS,
# QITS_IDP_BROWSER_SSO_CANONICAL_ORIGIN and QITS_IDP_BROWSER_SSO_COOKIE_DOMAIN. They restated the
# fact QITS_DOMAIN already carries, from outside this repository, and went stale where nothing here
# could notice. A deployment that still sets one is ignored. QITS_IDP_ISSUER joined them with
# qits-730: the issuer is derived from QITS_DOMAIN, and a deployment that still sets it is ignored.
# qits-163 added QITS_IDP_CLI_AUDIENCES and QITS_IDP_WORKSTATION_GITHOST_AUDIENCE (every token's
# audience is qits-platform) and every QITS_IDP_CLIENT_<ID>_AUDIENCES / _ROLES / _CLAIMS_<NAME>.
# QITS_IDP_CLIENTS and QITS_IDP_CLIENT_<ID>_SECRET are read once more, at the first start of that
# version, to adopt those clients into the database (EnvironmentClientAdoption), and never again.

# --- the packaged artifact ----------------------------------------------------------------------
# Name the build output `qits-idp` rather than qits-idp-service-<version>-runner, so `-Dnative`
# produces target/qits-idp and the process is identifiable in `ps`. The name is spelled TWICE:
# here, and as failsafe's native.image.path in service/pom.xml. They move together — if they drift,
# the native IT launches nothing and passes.
quarkus.package.output-name=qits-idp
quarkus.package.jar.add-runner-suffix=false

# --- telemetry ----------------------------------------------------------------------------------
# One key names the receiver: qits.observability.url — scheme, host and port, NO path. The ingest
# path is qits-observability's own and belongs to the service, not to the deployment, so it is
# spelled once here and derived rather than configured. Point this at a collector or a different
# host and everything below follows.
qits.observability.url=http://${QITS_ENVIRONMENT:dev}-qits-observability:8080

# http/protobuf, not the gRPC default: the receiver is OtelReceiverResource over HTTP, and the
# exporter appends /v1/<signal> to this base — so this resolves to the three ingest routes at
# /observability/api/otel/v1/{traces,logs,metrics}.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${qits.observability.url}/observability/api/otel

# Logs ride the same exporter; traces are on by default. The receiver decodes all three signals, and
# a log record correlated to a trace is most of why the receiver exists.
#
# THE THREE KEYS BELOW ARE SPELLED OUT ON PURPOSE. Quarkus still labels its OpenTelemetry logging
# integration PREVIEW, and the whole of what ships application logs to qits-observability is the
# handler this enables — so an upgrade that changed one of these defaults would stop the platform's
# logging with a green build and no error anywhere. Written down, a change of default is a diff
# rather than a silence. Measured against Quarkus 3.34.6's own config classes rather than recalled:
#
#   quarkus.otel.logs.handler.enabled  default true  (LogsRuntimeConfig.handlerEnabled)
#   quarkus.otel.logs.exporter         default cdi   (LogsBuildConfig.exporter)
#   quarkus.otel.logs.level            default ALL   (LogsRuntimeConfig.level)
#
# `cdi` is what routes the records at the exporter configured above rather than at a second,
# separately-configured one; `handler.enabled` is the JBoss Log Manager handler that turns an
# ordinary org.jboss.logging.Logger call into an OTLP record, and without it the other two keys
# describe a pipe nothing enters.
#
# The level is the ONE line here that is not the shipped default: Quarkus exports every record the
# log manager creates, and this makes INFO the outbound floor. Per-category quarkus.log levels still
# decide which records exist at all; this is a second gate on the way out, so that what leaves the
# process is a deliberate amount rather than whatever a debug category happens to emit. Console
# logging is untouched by all of it — the OTel handler is an ADDITIONAL copy, never the only one,
# which is what keeps a container's stdout the durable-at-host fallback when the receiver is down.
#
# The bridge itself is proven in qits-events, whose OtelLogBridgeTest decodes a real
# ExportLogsServiceRequest and whose PackagedLogBridgeIT repeats it against the packaged artifact.
# The extension and this configuration are the same here, so this repo carries no second copy of
# that proof — only OtelLogConfigTest, which pins these four keys and the exporter they ride.
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO

# Metrics ride it too. Off by default in Quarkus, so without this line the third signal never
# leaves — the receiver has always decoded it, and the observability UI has nothing to plot until
# every service says this. This was the other key missing here while the siblings all had it.
quarkus.otel.metrics.enabled=true

# Dark outside a deployment. A clone-alone `./mvnw verify` and a `quarkus:dev` have no
# qits-observability to reach, and an exporter retrying against an unresolvable host turns every
# suite into a wall of export failures. The deployment is where telemetry is real.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true

# Test-only overrides. This module is the deployable, so its app-level settings live in
# src/main/resources/application.properties and Quarkus MERGES that file into the test config — it
# is not shadowed by this one. Never re-declare an app-level setting here: a test copy that drifts
# from the shipped copy makes the suite lie, passing on a value no deployment ever gets.

# A FREE port, not Quarkus' default test port 8081 — on the deployment host that address is the
# platform's own npm registry (qits-artifacts), so the default dies with "Port already bound" in a
# way that reads like a code failure. 0 lets the OS pick and RestAssured is told the real port.
# Failsafe passes the same value to the packaged artifact (service/pom.xml).
quarkus.http.test-port=0

# NO DEV SERVICES. A dev service is a container start, and the first rule here is that a clone tests
# green with no docker. A datasource that already has a url invites none, but the flag says so
# outright rather than leaving it to a config source having run first.
quarkus.devservices.enabled=false

# The suite runs against an EMBEDDED POSTGRES — real binaries, spawned as a child process by zonky,
# never a container — overriding the QITS_RESOURCE_DB_* triple the idp jar's
# META-INF/microprofile-config.properties reads. Its port is chosen at run time, so the url,
# username and password are not written here at all: EmbeddedPgConfigSource supplies them at an
# ordinal above this file. What is left here is what a file can say. clean-at-start wipes the schema
# between runs, so every run generates its own signing key.
quarkus.hibernate-orm.idp.datasource=idp
quarkus.hibernate-orm.idp.packages=eu.wohlben.qits.idp.entity
quarkus.flyway.idp.migrate-at-start=true
quarkus.flyway.idp.clean-at-start=true
quarkus.flyway.idp.locations=classpath:db/idp/migration

# --- the suite's own clients ---------------------------------------------------------------------
#
# Service clients are database rows now (qits-163), and this is how the suite gets its first ones:
# the same one-time adoption a live installation runs at its first start of that version
# (EnvironmentClientAdoption). Every id below with a secret becomes an idp_service_client row,
# created_by = 'adopted', when the application starts against the freshly cleaned schema. These keys
# are therefore not an "environment registry" the suite tests against — they are the adoption's
# input, and nothing reads them after that start.
#
# prod-qits-workspaces deliberately gets NO secret. The adoption skips an id without one, so it never
# becomes a row and stays unknown: IdpTokenTest.aClientWithNoSecretIsUnusableRatherThanOpen and
# EnvironmentClientAdoptionTest both rely on that.
qits.idp.clients=prod-qits-workspaces,test-broad,test-narrow,test-audienceless,test-role-thief

# The everyday client, and the owner most commission tests use.
qits.idp.client.test-broad.secret=test-broad-secret

# A second, independent service client, so "another owner" has somebody to be.
qits.idp.client.test-narrow.secret=test-narrow-secret

# A third, for the session and register-token doors. Its name is older than the change: it used to
# have no audience list. Every client has the one audience now.
qits.idp.client.test-audienceless.secret=test-audienceless-secret

# A client whose configuration also carries a roles line naming ANOTHER client's minted self-role,
# and an audience list. Neither key is read any more (qits-163): the adopted row gets the fixed
# service-client roles in code and the one audience, which IdpTokenTest pins.
qits.idp.client.test-role-thief.secret=test-role-thief-secret
qits.idp.client.test-role-thief.roles=qits:system,clients/test-broad
qits.idp.client.test-role-thief.audiences=qits-deployments

# --- roles per commission kind ---------------------------------------------------------------------
#
# GONE: a commission's roles are code now (CommissionRoles, epic qits-540 dossier, "Plan (as of
# 2026-09-13)", D3/D12),
# never configuration, so there is nothing left to override here. The four shipped kinds (workspace,
# agent-container, refinement, ci-run) are tested as shipped in CommissionedGitRefsTest; any other
# kind — including a test-only one — gets no role at all beyond its own `clients/<id>` (D12).

# --- the userflows class orderer, installed the one way Quarkus permits -----------------------------
#
# quarkus-junit ships its own junit-platform.properties naming a ClassOrderer that groups test
# classes by @TestProfile (so a profile's application is not torn down under a class still running),
# and surefire HARD-FAILS if a local junit-platform.properties overrides it. The blessed seam is the
# SECONDARY orderer, which breaks ties INSIDE a profile group: story classes sharing a profile still
# run in topological @UserflowPrecondition order, and the ordinary test classes — every class in
# this module except TokenIssuanceBootstrapIT, none of which carries a story annotation — are
# untouched.
#
# The framework's registries are per-JVM: keep the single sequential test JVM (surefire/failsafe
# default forkCount=1) and do not enable parallel execution.
junit.quarkus.orderer.secondary-orderer=eu.wohlben.qits.userflows.UserflowClassOrderer

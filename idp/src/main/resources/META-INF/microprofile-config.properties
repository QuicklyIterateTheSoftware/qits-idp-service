# idp config defaults, shipped from this library jar. Library jars ship defaults as
# META-INF/microprofile-config.properties (ordinal 100) — a jar's application.properties is ignored
# — read by whichever app pulls the jar in. The consuming app / env overrides any of these.
#
# idp owns its OWN named datasource + persistence unit + Flyway lineage: a postgres database of its
# own. Nothing else may share it: the signing key lives there, and that database is the only reason
# a token issued before a restart still verifies after one.
#
# THE THREE KEYS BELOW ARE THE PLATFORM'S GENERIC RESOURCE CONTRACT. A repository declares
# `resources: postgresql:db` in .config/qits/deployments.yml; qits-platform-deployments creates the
# role and the database before the successor container starts and injects QITS_RESOURCE_DB_URL /
# _USERNAME / _PASSWORD into it. Nothing here is idp-specific — an application maps the generic
# variables in its own shipped defaults, which is what keeps the deployer framework-agnostic. This
# service is a CORE SEED service, so at bootstrap the same triple arrives from the CLI instead: it
# provisions the database over plain JDBC before a deployer exists. Either way this jar reads one
# contract and does not know which side filled it.
#
# THE TRIPLE HAS NO DEFAULTS AND THAT IS THE REFUSE-TO-BOOT STANCE. An unset variable leaves these
# expressions unresolvable, so the process dies at Flyway's migrate-at-start naming the missing
# variable rather than opening some fallback store nobody meant. There is no local file to fall back
# to any more, and for this service the stake is the highest on the platform: an idp that came up
# against a store nobody meant would generate a NEW signing key and invalidate every token in
# flight, everywhere, with nothing in any log to say why.
quarkus.datasource.idp.db-kind=postgresql
quarkus.datasource.idp.jdbc.url=${QITS_RESOURCE_DB_URL}
quarkus.datasource.idp.username=${QITS_RESOURCE_DB_USERNAME}
quarkus.datasource.idp.password=${QITS_RESOURCE_DB_PASSWORD}

# THE POOL SURVIVES A POSTGRES CUTOVER, WHICH STOCK AGROAL DOES NOT. Replacing the tier's postgres
# severs every pooled connection; without validation the pool hands a dead one to the next caller
# long after the database is back, and 5s of acquisition is not enough for the successor to take the
# alias. Validate at borrow, and wait 15s before giving up.
#
# The driver is the third line of the platform's baseline and the three do less apart than they read
# as. PatientPgDriver (qits-db-core) delegates to org.postgresql.Driver and, when the database is not
# there, keeps asking for up to 14s instead of failing at once — it retries a refusal and postgres'
# "the database system is starting up", and fails a wrong password on the first attempt.
# validate-on-borrow is what turns a dead pooled connection into the fresh creation attempt it can be
# patient about; the 15s acquisition timeout outlasts its deadline, so a caller that waits it out
# gets the database's real refusal rather than a generic pool message. The url stays a plain
# jdbc:postgresql: one, so the QITS_RESOURCE_DB_URL contract above is untouched. It matters more here
# than almost anywhere: every service's token request comes through this one, so a cutover that fails
# them fails the platform's whole call graph rather than one application.
# `DatasourceBaselineTest` fails the build if a line goes missing; the measurements are in the
# superproject's docs/project-setup-quinoa-angular.md.
quarkus.datasource.idp.jdbc.driver=eu.wohlben.qits.db.PatientPgDriver
quarkus.datasource.idp.jdbc.acquisition-timeout=15S
quarkus.datasource.idp.jdbc.validate-on-borrow=true

# A dedicated persistence unit bound to the idp datasource, owning only this module's entities.
quarkus.hibernate-orm.idp.datasource=idp
quarkus.hibernate-orm.idp.packages=eu.wohlben.qits.idp.entity

# Own Flyway lineage at a distinct classpath location. ONE lineage: the move to postgres is a clean
# start, so there is a single V1 and no history inherited from the H2 lineage.
#
# baseline-on-migrate is GONE with that lineage. It told Flyway to adopt a non-empty schema it had
# no history table for, which the H2 file needed while it was being adopted; every database this
# code now meets is either empty or was created by this very lineage, and the flag would only mask
# the one case worth failing on — a schema somebody else put there.
quarkus.flyway.idp.migrate-at-start=true
quarkus.flyway.idp.locations=classpath:db/idp/migration

# --- the issuer, and the address, which are two values ---------------------------------------------
#
# THE ISSUER IS AN IDENTIFIER AND NOT AN ADDRESS, AND IT IS NOT A LINE HERE. It is the `iss` of every
# token and the `issuer` member of the discovery document, and nothing dials it. It is DERIVED from
# the platform's domain — https://idp.qits.<QITS_DOMAIN>, https://idp.qits.localhost with none
# stated — in Issuer.url() (qits-730). Never give it a key or a default: a configurable issuer is a
# string another service can be handed the wrong value of, and an address read as an issuer refuses
# every machine token.

# THE ENDPOINT BASE IS AN ADDRESS AND IS DIALLED. The discovery document hangs token_endpoint,
# jwks_uri and authorization_endpoint off it.
#
# It used to be the issuer, which was right while the two were the same string and became a defect
# the moment they parted: the document went on advertising a jwks_uri on the bare alias, so a
# consumer booting with nothing cached followed it to an UnknownHostException and rolled back,
# while every already-running consumer carried on from its cache. A working platform hid it.
#
# Derived from the environment rather than carried as a deployment config entry: an address that
# follows one rule is code. A config row holding it is a second copy of that rule, and the second
# copy is the one that goes stale without saying so.
qits.idp.endpoint-base=${QITS_IDP_ENDPOINT_BASE:http://${QITS_ENVIRONMENT:dev}-qits-idp:8080/idp}

# How long an issued token is good for.
#
# RAISED FROM 300 TO 3600 ON 2026-08-14, a user decision recorded with the commission model
# (authenticated-reads-plan.md, "the credential model"). What changed is that the LONG-LIVED thing
# is now the commissioned id+secret pair, not the token: a workspace that runs for days holds the
# pair and re-mints underneath itself, so a context's lifetime no longer depends on a token's. The
# TTL surfaces in exactly two places after that — a consumer wired with a bare minted token instead
# of the pair, and the post-decommission grace — and the raise exists to put the first class out of
# scope for now rather than design refresh/recommissioning on the way past it.
#
# THE NAMED COST, ACCEPTED: the grace widens to the same hour. Decommissioning is deleting the row,
# which stops the client minting IMMEDIATELY — but a token it minted a second earlier keeps working
# until its own `exp`, everywhere, because validation is offline against the JWKS and there is no
# revocation list. Revisit this number together with per-context permission scoping; shrinking it
# again is this one key.
qits.idp.token-ttl-seconds=3600

# How long the JWT an introspection of a COMMISSIONED TOKEN answers with is good for (qits-450).
#
# A commissioned token is opaque and has no expiry: deleting its row refuses the very next
# introspection. But POST /idp/api/tokens/introspect also mints a short JWT for the edge to hand to
# the service behind it, and that JWT is verified offline like any other — so THIS is the upper
# bound on how long a deleted token keeps working BEHIND the edge. At the edge itself the bound is
# the edge's own introspection cache, qits.edge.auth.token-cache-ttl-ms (15 s). Five minutes rather
# than the hour above, because the smaller this number, the smaller the grace after a delete.
qits.idp.token-introspection-jwt-ttl-seconds=300

# --- local Git workstations ----------------------------------------------------------------------
#
# A local workstation is a PKCE-only public OAuth client, never a service client.  Its access token
# is short lived, has only the qits:git:external role, and carries the ref-pattern claim the githost
# enforces.  Its audience is qits-platform, like every token's (qits-163) — there is no githost
# audience any more.  The durable credential is the opaque refresh token: it rotates on every use
# and can be revoked per workstation family from the signed-in account.
qits.idp.workstation.client-id=qits-git-workstation

qits.idp.workstation.access-token-ttl-seconds=900
qits.idp.workstation.authorization-code-ttl=PT2M
qits.idp.workstation.refresh-token-ttl=PT720H

# --- the command-line tool ------------------------------------------------------------------------
#
# The second public client. Same protocol as the workstation above — authorization code with PKCE
# S256, no secret, a rotating refresh family that replay revokes — and three differences:
#
#   * THE REDIRECT TARGET MAY BE THIS IDP'S OWN PAGE. `qits login` has no browser to catch a
#     loopback redirect at the moment the person finishes signing in, so the idp shows the code on
#     <origin>/idp/connect/cli and the person pastes it into the waiting command. PKCE is what makes
#     that safe: the pasted code is useless without the verifier the waiting process holds, so a
#     code that leaks through a clipboard or a screen share cannot be spent. Loopback stays allowed
#     for a CLI that does have a listener.
#
#   * THE TOKEN CARRIES THE PERSON'S OWN ROLES, not one fixed narrow role. The CLI is the person at
#     a terminal, so it is as strong as the browser session they just signed in with; narrowing it
#     to a project or a service is named later work. What holds the blast radius is the 900-second
#     access token, rotation with replay detection, and revoke-per-device.
#
#   * THE CODE LIVES FIVE MINUTES, not two. A loopback redirect is caught in milliseconds; a person
#     reading a code off a page, switching to a terminal and pasting it is not. Two minutes is a
#     deadline a distracted person misses, and missing it looks like a broken login.
qits.idp.cli.client-id=qits-cli

# A CLI token's audience is `qits-platform`, like every token's, and it is not a key (qits-163).
# A person's CLI may call every qits service; the token's roles (`groups`) decide what the person may
# do, not the audience.

# Fifteen minutes, the same as a workstation's: a stolen access token is unrevocable until it
# expires, because validation is offline against the JWKS.
qits.idp.cli.access-token-ttl-seconds=900

# See the five-minute note above.
qits.idp.cli.authorization-code-ttl=PT5M

# There is deliberately no qits.idp.cli.refresh-token-ttl: the CLI's families expire on
# qits.idp.workstation.refresh-token-ttl above. The number answers "how long may a person stay
# signed in on a device they still hold", which is a fact about the person and the installation
# rather than about which tool is asking — and two keys would be two values to drift apart, with
# "my CLI logged out but my Git did not" as the thing somebody then has to explain. Split it on the
# day the two answers genuinely differ. WorkstationCredentials says the same at the field.

# --- the landing SPA under ng serve ----------------------------------------------------------------
#
# The third public client, for local development only. A page served by `ng serve` from
# http://localhost:4200 is a different site from the platform, so the SameSite=Lax session cookie
# never travels with its API calls. It signs in like the CLI instead — authorization code with PKCE
# S256, no secret — and gets exactly the CLI's token: the person's roles, the qits-platform audience,
# qits.idp.cli.access-token-ttl-seconds, and a refresh family on
# qits.idp.workstation.refresh-token-ttl. Production pages keep the cookie.
#
# Its one redirect rule is http://{localhost|127.0.0.1|[::1]}:<any port>/auth/callback, exact path,
# no query or fragment (IdpWorkstationController). `localhost` is accepted for this client only: the
# PKCE verifier lives in the page's own storage, which is per origin, so the callback has to land on
# the origin the developer opened — and `ng serve` opens http://localhost:4200. RFC 8252 prefers the
# IP literal because a name can be pointed elsewhere; PKCE is what makes that acceptable here, since
# a code caught by anything else is worthless without the verifier the page holds.
qits.idp.dev-spa.client-id=qits-landing-dev

# Two minutes, like the workstation's: the browser follows the redirect at once.
qits.idp.dev-spa.authorization-code-ttl=PT2M

# The RSA modulus size for a key this service GENERATES. Existing keys are used as they are stored,
# so changing this rotates nothing by itself.
qits.idp.signing-key-bits=2048

# --- user sessions --------------------------------------------------------------------------------
#
# How long a browser session lives, from the moment it is opened. ABSOLUTE, not idle: a session dies
# twelve hours after login whatever the user did in between, because sliding renewal is a named open
# question in user-authentication-plan.md and not a blocker — logging in again is one ceremony.
#
# Twelve hours is a working day plus the evening. Long enough that an operator is not asked to
# re-authenticate mid-task, short enough that a browser left open on a machine somewhere has stopped
# being a way in by the next morning. A deployment overrides it (QITS_IDP_SESSION_TTL) with anything
# java.time.Duration parses; there is nothing about the number this repository knows better than an
# installation does.
#
# It is the deadline stamped on the idp_session row AND the cookie's Max-Age, from one value, so a
# browser never holds a cookie the store has already stopped honouring.
qits.idp.session-ttl=PT12H

# --- service clients -------------------------------------------------------------------------------
#
# Service clients are rows in `idp_service_client`, created and rotated through
# `/idp/api/service-clients` rather than configured here (epic qits-540, dossier page "Plan (as of
# 2026-09-13)", contract C2). A row's roles and claims are code — see ClientRegistry: `qits:system`,
# its own `clients/<id>`, and `project=*`. Every token's audience is `qits-platform`. So there is
# nothing to ship a key reference for beyond the one seam that IS configuration: the very first row,
# which nothing can create through the API because nothing can authenticate to it yet.
#
#   qits.idp.seed-client.id       the id of the one service client this process seeds at first boot.
#   qits.idp.seed-client.secret   its secret, hashed on the way into idp_service_client and never
#                                 read back.
#
# QITS_IDP_SEED_CLIENT_ID / QITS_IDP_SEED_CLIENT_SECRET are the env spellings, and both are unset by
# default — no default seed identity ships. SEEDING RUNS AT MOST ONCE PER INSTALLATION: the
# `idp_seed` marker row, not the variables, decides "once", so leaving the variables set on every
# later boot (the ordinary case) seeds nothing a second time, and a deleted seed client does not come
# back by restarting the process that made it.
#
# THE OLD ENVIRONMENT REGISTRY IS GONE (qits-163). It was `qits.idp.clients` plus
# `qits.idp.client.<id>.secret|audiences|roles|claims.<name>`, and this file used to ship three ids
# with audiences and roles and no secrets. At the first start of this version, each id on
# `qits.idp.clients` (QITS_IDP_CLIENTS) with a non-blank secret
# (QITS_IDP_CLIENT_<ID>_SECRET) and no row is adopted into idp_service_client, once, behind the
# `idp_adoption` marker row — see EnvironmentClientAdoption. After that nothing reads those keys.
# The `audiences`, `roles` and `claims.<name>` keys are not read at all.
